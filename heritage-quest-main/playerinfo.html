<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Quest - Player Profile</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Montserrat:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .heritage-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .form-frame {
            position: relative;
            z-index: 5;
            background: rgba(7, 6, 11, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid var(--gold-mid);
            border-radius: 15px;
            padding: 50px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(215, 151, 60, 0.1);
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-frame h2 {
            color: var(--gold-bright);
            font-family: var(--font-serif);
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }

        .form-frame .subtitle {
            color: var(--gold-mid);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: var(--gold-bright);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid var(--gold-mid);
            border-radius: 8px;
            color: var(--gold-bright);
            font-family: var(--font-sans);
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(215, 151, 60, 0.05);
            border-color: var(--gold-bright);
            box-shadow: 0 0 15px rgba(215, 151, 60, 0.3);
        }

        .form-group input::placeholder {
            color: rgba(255, 230, 153, 0.5);
        }

        .form-group input:valid {
            border-color: var(--gold-bright);
        }

        .form-group small {
            font-size: 0.85rem;
            display: block;
            margin-top: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 25px;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-mid));
            color: #050409;
            border: none;
            border-radius: 8px;
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(215, 151, 60, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(215, 151, 60, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: var(--gold-mid);
            text-decoration: none;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            color: var(--gold-bright);
        }
    </style>
</head>
<body>
    <!-- Background Music (looped) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/odisha-music.mp3" type="audio/mpeg">
    </audio>

    <!-- Background overlay -->
    <div class="ambient-glow" id="ambientGlow"></div>

    <!-- Music Control Caption -->
    <div class="music-caption">Double click to mute</div>

    <!-- Main Container -->
    <div class="heritage-container" id="heritageQuestApp" style="background: url('assets/profile-bg.jpeg') no-repeat center center; background-size: cover;">
        <!-- Canvas for particles -->
        <canvas class="particles-canvas" id="ambientCanvas"></canvas>

        <!-- Player Info Form -->
        <main class="form-frame" id="playerFormFrame">
            <h2>Your Profile</h2>
            <p class="subtitle">Begin your heritage journey by telling us about yourself</p>

            <form id="playerForm">
                <div class="form-group">
                    <label for="playerName">Full Name</label>
                    <input 
                        type="text" 
                        id="playerName" 
                        name="playerName" 
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="playerEmail">Email ID</label>
                    <input 
                        type="email" 
                        id="playerEmail" 
                        name="playerEmail" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="playerAge">Age</label>
                    <input 
                        type="number" 
                        id="playerAge" 
                        name="playerAge" 
                        placeholder="Enter your age"
                        min="1"
                        max="120"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="playerPhone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="playerPhone" 
                        name="playerPhone" 
                        placeholder="+91 XXXXXXXXXX"
                        pattern="\+91\d{10}"
                        maxlength="13"
                        required
                    >
                    <small style="color: rgba(255, 230, 153, 0.7); display: block; margin-top: 5px;">Please enter phone number starting with +91 (Indian format)</small>
                </div>

                <button type="submit" class="submit-btn">Begin Quest</button>
            </form>

            <a class="back-btn" onclick="goBack()">← Back to Home</a>
        </main>
    </div>

    <script src="playerinfo.js"></script>
</body>
</html>
