<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Quest - Player Profile</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Montserrat:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            font-family: var(--font-sans);
            background-color: var(--bg-dark);
            padding: 20px 0;
        }

        .heritage-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        .form-frame {
            position: relative;
            z-index: 5;
            background: rgba(7, 6, 11, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--gold-mid);
            border-radius: 16px;
            padding: clamp(24px, 4vw, 40px);
            max-width: 480px;
            width: 100%;
            margin: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), inset 0 0 25px rgba(215, 151, 60, 0.12);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-frame h2 {
            color: var(--gold-bright);
            font-family: var(--font-serif);
            font-size: clamp(1.6rem, 3vw, 2.1rem);
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(215, 151, 60, 0.4);
        }

        .form-frame .subtitle {
            color: var(--gold-mid);
            font-family: var(--font-sans);
            font-size: clamp(0.8rem, 1.5vw, 0.9rem);
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: var(--gold-bright);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(215, 151, 60, 0.5);
            border-radius: 8px;
            color: #ffffff;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(215, 151, 60, 0.08);
            border-color: var(--gold-bright);
            box-shadow: 0 0 15px rgba(215, 151, 60, 0.35);
        }

        .form-group input::placeholder {
            color: rgba(255, 230, 153, 0.4);
        }

        .form-group small {
            font-size: 0.78rem;
            display: block;
            margin-top: 5px;
            color: rgba(255, 230, 153, 0.75);
            line-height: 1.3;
        }

        .submit-btn {
            width: 100%;
            padding: 13px 20px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-mid));
            color: #050409;
            border: none;
            border-radius: 8px;
            font-family: var(--font-serif);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(215, 151, 60, 0.35);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(215, 151, 60, 0.55);
            filter: brightness(1.08);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-btn-container {
            text-align: center;
            margin-top: 16px;
        }

        .back-btn {
            display: inline-block;
            color: var(--gold-mid);
            text-decoration: none;
            font-family: var(--font-sans);
            font-size: 0.88rem;
            transition: all 0.3s ease;
            cursor: pointer;
            padding: 4px 10px;
        }

        .back-btn:hover {
            color: var(--gold-bright);
            text-shadow: 0 0 8px rgba(215, 151, 60, 0.6);
        }

        @media (max-height: 700px) {
            body {
                padding: 10px 0;
            }
            .form-frame {
                padding: 20px 25px;
            }
            .form-group {
                margin-bottom: 12px;
            }
            .form-frame .subtitle {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Music (looped) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/odisha-music.mp3" type="audio/mpeg">
    </audio>

    <!-- Background overlay -->
    <div class="ambient-glow" id="ambientGlow"></div>

    <!-- Music Control Caption -->
    <div class="music-caption">Double click to mute</div>

    <!-- Main Container -->
    <div class="heritage-container" id="heritageQuestApp" style="background: url('assets/profile-bg.jpeg') no-repeat center center; background-size: cover;">
        <!-- Canvas for particles -->
        <canvas class="particles-canvas" id="ambientCanvas"></canvas>

        <!-- Player Info Form -->
        <main class="form-frame" id="playerFormFrame">
            <h2>Your Profile</h2>
            <p class="subtitle">Begin your heritage journey by telling us about yourself</p>

            <form id="playerForm">
                <div class="form-group">
                    <label for="playerName">Full Name</label>
                    <input 
                        type="text" 
                        id="playerName" 
                        name="playerName" 
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="playerEmail">Email ID</label>
                    <input 
                        type="email" 
                        id="playerEmail" 
                        name="playerEmail" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="playerAge">Age</label>
                    <input 
                        type="number" 
                        id="playerAge" 
                        name="playerAge" 
                        placeholder="Enter your age"
                        min="1"
                        max="120"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="playerPhone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="playerPhone" 
                        name="playerPhone" 
                        placeholder="+91 9876543210"
                        required
                    >
                    <small>Enter 10-digit mobile number (e.g. +91 9876543210 or 9876543210)</small>
                </div>

                <button type="submit" class="submit-btn">Begin Quest</button>
            </form>

            <div class="back-btn-container">
                <a class="back-btn" onclick="goBack()">← Back to Home</a>
            </div>
        </main>
    </div>

    <script src="playerinfo.js"></script>
</body>
</html>
