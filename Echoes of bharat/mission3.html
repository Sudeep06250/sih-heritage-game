/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    background: #02080d;

    color: #f4eee2;

    font-family:
        Georgia,
        &quot;Times New Roman&quot;,
        serif;
}


/* =========================================================
   MAIN BACKGROUND
========================================================= */

.mission {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background-image:

        linear-gradient(
            90deg,
            rgba(0, 5, 10, 0.88) 0%,
            rgba(0, 7, 12, 0.70) 38%,
            rgba(0, 7, 12, 0.25) 72%,
            rgba(0, 5, 10, 0.42) 100%
        ),

        linear-gradient(
            180deg,
            rgba(0, 4, 8, 0.16) 0%,
            rgba(0, 4, 8, 0.08) 45%,
            rgba(0, 4, 8, 0.62) 100%
        ),

        url(&quot;assets/mode2.jpeg&quot;);

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;
}


/* =========================================================
   VIGNETTE
========================================================= */

.mission::after {

    content: &quot;&quot;;

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 34%,
            rgba(0,0,0,0.38) 100%
        );

    z-index: 1;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: absolute;

    z-index: 20;

    top: 0;
    left: 0;
    right: 0;

    height: 58px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 3.7vw;

    border-bottom:
        1px solid rgba(230,235,225,0.13);

    background:
        linear-gradient(
            180deg,
            rgba(0,4,8,0.78),
            rgba(0,4,8,0.10)
        );
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 11px;

    color: #e4bf67;

    font-family: Arial, sans-serif;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 2.6px;

    text-transform: uppercase;
}


.brand-symbol {

    width: 29px;

    height: 29px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid #dcb968;

    border-radius: 50%;

    font-size: 9px;
}


.mission-id {

    color:
        rgba(235,240,236,0.48);

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =========================================================
   CONTENT
   COMPACTED SO NOTHING TOUCHES THE BOTTOM
========================================================= */

.content {

    position: absolute;

    z-index: 10;

    left: 4vw;

    top: 8.5%;

    width: 680px;
}


/* =========================================================
   EYEBROW
========================================================= */

.eyebrow {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 7px;

    color: #70dfe1;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 3px;

    text-transform: uppercase;
}


.eyebrow::before {

    content: &quot;&quot;;

    width: 36px;

    height: 1px;

    background: #70dfe1;
}


/* =========================================================
   TITLE
========================================================= */

.title {

    color: #fff8e8;

    font-size:
        clamp(42px, 4.2vw, 63px);

    line-height: 0.84;

    font-weight: 500;

    text-transform: uppercase;

    text-shadow:
        0 5px 24px rgba(0,0,0,0.95);
}


.title span {

    display: block;

    margin-top: 5px;

    color: #e3bd66;

    font-size: 0.61em;

    letter-spacing: 2px;
}


/* =========================================================
   DIVIDER
========================================================= */

.divider {

    width: 105px;

    height: 1px;

    margin: 11px 0 9px;

    background:
        linear-gradient(
            90deg,
            #dfbc68,
            transparent
        );
}


/* =========================================================
   STORY
========================================================= */

.story {

    width: 610px;

    color:
        rgba(249,245,235,0.90);

    font-size: 14px;

    line-height: 1.32;

    text-shadow:
        0 2px 9px rgba(0,0,0,0.95);
}


.story strong {

    color: #70dfe1;
}


/* =========================================================
   QUIZ PANEL
========================================================= */

.quiz-panel {

    margin-top: 11px;

    width: 680px;

    padding:
        14px 20px 11px;

    border-left:
        4px solid #70dfe1;

    border-top:
        1px solid rgba(110,220,225,0.18);

    border-bottom:
        1px solid rgba(110,220,225,0.14);

    background:
        rgba(1,10,16,0.89);

    backdrop-filter: blur(8px);

    box-shadow:
        0 18px 40px rgba(0,0,0,0.45);
}


/* =========================================================
   QUIZ HEADER
========================================================= */

.quiz-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 7px;
}


.quiz-label {

    color: #70dfe1;

    font-family: Arial, sans-serif;

    font-size: 8px;

    font-weight: bold;

    letter-spacing: 2.4px;

    text-transform: uppercase;
}


.question-count {

    color:
        rgba(237,239,233,0.48);

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 1.7px;
}


/* =========================================================
   QUESTION
========================================================= */

.question {

    min-height: 45px;

    color: #fff7e7;

    font-size: 18px;

    line-height: 1.20;

    font-weight: bold;
}


/* =========================================================
   OPTIONS
========================================================= */

.options {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 9px;
}


/* =========================================================
   OPTION CARD
========================================================= */

.option {

    position: relative;

    min-height: 78px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 6px;

    border:
        1px solid rgba(218,191,111,0.35);

    background:
        rgba(8,20,27,0.82);

    color:
        rgba(247,242,231,0.88);

    font-family:
        Georgia,
        &quot;Times New Roman&quot;,
        serif;

    font-size: 11.5px;

    line-height: 1.25;

    text-align: left;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
}


/* =========================================================
   OPTION IMAGE
========================================================= */

.option-image {

    width: 67px;

    height: 64px;

    flex-shrink: 0;

    object-fit: cover;

    border:
        1px solid rgba(230,220,190,0.18);

    filter:
        brightness(0.78);

    transition:
        filter 0.2s ease;
}


.option:hover {

    border-color:
        rgba(112,224,226,0.78);

    background:
        rgba(18,42,49,0.90);

    color: white;
}


.option:hover .option-image {

    filter:
        brightness(1);
}


/* =========================================================
   OPTION LETTER
========================================================= */

.option-letter {

    position: absolute;

    top: 5px;

    left: 5px;

    width: 19px;

    height: 19px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid rgba(219,190,105,0.65);

    border-radius: 50%;

    background:
        rgba(2,10,15,0.85);

    color: #dfbd6b;

    font-family: Arial, sans-serif;

    font-size: 8px;

    font-weight: bold;

    z-index: 3;
}


/* =========================================================
   OPTION TEXT
========================================================= */

.option-text {

    padding:
        4px 6px 4px 0;
}


/* =========================================================
   CORRECT
========================================================= */

.option.correct {

    border-color:
        #6fe0e1;

    background:
        rgba(26,72,76,0.78);

    color: #e9ffff;
}


/* =========================================================
   WRONG
========================================================= */

.option.wrong {

    border-color:
        #b87867;

    background:
        rgba(82,39,32,0.55);

    color:
        rgba(255,225,215,0.8);
}


/* =========================================================
   FEEDBACK
========================================================= */

.feedback {

    min-height: 22px;

    margin-top: 6px;

    color:
        rgba(239,239,232,0.65);

    font-family: Arial, sans-serif;

    font-size: 9px;

    line-height: 1.3;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-area {

    margin-top: 4px;

    display: flex;

    align-items: center;

    gap: 12px;
}


.progress-text {

    color:
        rgba(236,239,234,0.45);

    font-family: Arial, sans-serif;

    font-size: 7px;

    letter-spacing: 1.5px;

    white-space: nowrap;
}


.progress-bar {

    width: 160px;

    height: 3px;

    background:
        rgba(255,255,255,0.12);

    overflow: hidden;
}


.progress-fill {

    width: 25%;

    height: 100%;

    background: #70dfe1;

    transition:
        width 0.3s ease;
}


/* =========================================================
   FIELD TIP
========================================================= */

.tip {

    position: absolute;

    z-index: 15;

    right: 4vw;

    top: 11vh;

    width: 155px;

    padding: 15px;

    transform: rotate(2deg);

    background:
        #d8c18c;

    color:
        #342c1d;

    box-shadow:
        0 14px 30px rgba(0,0,0,0.45);
}


.tip::before {

    content: &quot;&quot;;

    position: absolute;

    top: -7px;

    left: 16px;

    width: 33px;

    height: 14px;

    background:
        rgba(205,181,127,0.65);
}


.tip-title {

    margin-bottom: 7px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;

    text-transform: uppercase;
}


.tip-text {

    font-size: 12px;

    line-height: 1.42;
}


/* =========================================================
   BOTTOM TOOLS
   MOVED DOWN AND KEPT CLEAR OF QUIZ
========================================================= */

.bottom-tools {

    position: absolute;

    z-index: 20;

    left: 4vw;

    bottom: 4.8vh;

    display: flex;

    gap: 28px;
}


.tool {

    display: flex;

    align-items: center;

    gap: 10px;

    border: none;

    background: none;

    color: #d9b968;

    cursor: pointer;

    font-family: Arial, sans-serif;
}


.tool-icon {

    width: 38px;

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid #d9b968;

    border-radius: 50%;

    font-size: 14px;
}


.tool-label {

    display: block;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 1.6px;

    text-transform: uppercase;
}


.tool-small {

    display: block;

    margin-top: 4px;

    color:
        rgba(235,239,235,0.43);

    font-size: 8px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    position: absolute;

    z-index: 25;

    left: 4vw;

    right: 4vw;

    bottom: 10px;

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-top:
        1px solid rgba(230,235,225,0.12);
}


.back {

    border: none;

    background: none;

    color:
        rgba(230,235,230,0.45);

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 1.7px;

    text-transform: uppercase;

    cursor: pointer;
}


.back:hover {

    color: #70dfe1;
}


.next {

    padding:
        8px 20px;

    border:
        1px solid rgba(220,190,105,0.55);

    background:
        rgba(2,12,17,0.68);

    color:
        #e1bd67;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    opacity: 0.35;

    pointer-events: none;
}


.next.ready {

    opacity: 1;

    pointer-events: auto;
}


.next.ready:hover {

    color: #70dfe1;

    border-color: #70dfe1;
}


/* =========================================================
   INFO MODAL
========================================================= */

.info-modal {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px;

    background:
        rgba(0,5,9,0.76);

    backdrop-filter: blur(6px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


.info-modal.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


.info-box {

    width: 520px;

    max-width: 90vw;

    padding: 27px 30px;

    background:
        linear-gradient(
            145deg,
            rgba(4,19,27,0.98),
            rgba(1,10,16,0.98)
        );

    border:
        1px solid rgba(112,224,226,0.35);

    border-left:
        4px solid #70dfe1;

    box-shadow:
        0 28px 70px rgba(0,0,0,0.78);
}


.info-label {

    margin-bottom: 8px;

    color: #70dfe1;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2.5px;
}


.info-title {

    margin-bottom: 14px;

    color: #e4bf67;

    font-size: 27px;
}


.info-text {

    color:
        rgba(244,241,232,0.82);

    font-size: 14px;

    line-height: 1.55;
}


.info-close {

    margin-top: 18px;

    padding: 9px 20px;

    border:
        1px solid rgba(217,185,104,0.55);

    background:
        transparent;

    color: #dfbd68;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;
}


/* =========================================================
   COMPLETION
========================================================= */

.complete {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,5,9,0.80);

    backdrop-filter: blur(6px);

    opacity: 0;

    visibility: hidden;
}


.complete.show {

    opacity: 1;

    visibility: visible;
}


.complete-box {

    width: 440px;

    max-width: 88vw;

    padding: 30px;

    text-align: center;

    border:
        1px solid rgba(112,224,226,0.45);

    background:
        rgba(2,12,18,0.96);

    box-shadow:
        0 30px 70px rgba(0,0,0,0.75);
}


.complete-label {

    color: #70dfe1;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2.5px;

    margin-bottom: 12px;
}


.complete h2 {

    color: #e4c16d;

    font-size: 29px;

    margin-bottom: 12px;
}


.complete p {

    color:
        rgba(240,240,233,0.76);

    font-size: 14px;

    line-height: 1.5;

    margin-bottom: 22px;
}


.complete-button {

    padding:
        11px 23px;

    border:
        1px solid #d9b968;

    background:
        transparent;

    color: #e4c16d;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .content {

        width: 600px;
    }

    .quiz-panel {

        width: 600px;
    }

    .tip {

        right: 2vw;
    }

}


@media (max-width: 800px) {

    body {

        overflow: auto;
    }

    .mission {

        min-height: 900px;

        height: auto;
    }

    .content {

        position: relative;

        top: auto;

        left: auto;

        width: auto;

        margin: 0 22px;

        padding-top: 80px;

        padding-bottom: 150px;
    }

    .story {

        width: auto;
    }

    .quiz-panel {

        width: auto;
    }

    .tip {

        display: none;
    }

    .bottom-tools {

        left: 22px;

        bottom: 55px;
    }

}


@media (max-width: 550px) {

    .options {

        grid-template-columns: 1fr;
    }

    .question {

        font-size: 18px;
    }

    .title {

        font-size: 43px;
    }

    .option {

        min-height: 82px;
    }

    .option-image {

        width: 65px;

        height: 65px;
    }

}

&lt;script&gt;

/* =========================================================
   MISSION 03 QUESTIONS
========================================================= */

const questions = [

    {

        question:
            &quot;You see several hatchlings emerging at night. Instead of moving toward the ocean, they are crawling toward a brightly lit building. What should be addressed FIRST?&quot;,

        options: [

            {
                /*
                   If flashlight.jpeg exists, it will be used.
                   If it does not, ocean.jpeg is shown instead,
                   so there will never be a broken image.
                */
                image:
                    &quot;assets/flashlight.jpeg&quot;,

                fallback:
                    &quot;assets/ocean.jpeg&quot;,

                text:
                    &quot;Remove, shield or reduce the artificial light visible from the beach.&quot;
            },

            {
                image:
                    &quot;assets/adult.jpeg&quot;,

                text:
                    &quot;Pick up every hatchling and carry them directly into the water.&quot;
            },

            {
                image:
                    &quot;assets/plasticbottle.jpeg&quot;,

                text:
                    &quot;Use a bright phone flashlight to create a new path toward the sea.&quot;
            },

            {
                image:
                    &quot;assets/sandpit.jpeg&quot;,

                text:
                    &quot;Make loud noises so the hatchlings turn around.&quot;
            }

        ],

        correct: 0,

        explanation:
            &quot;Correct. Artificial light can disrupt hatchlings&#x27; natural seaward orientation. The first response should be to address the light source rather than handling the hatchlings unnecessarily.&quot;

    },


    {

        question:
            &quot;Why do newly emerged hatchlings normally move toward the open ocean at night?&quot;,

        options: [

            {
                image:
                    &quot;assets/ocean.jpeg&quot;,

                text:
                    &quot;They use visual cues from the brighter seaward horizon to orient away from the darker landward silhouette.&quot;
            },

            {
                image:
                    &quot;assets/adult.jpeg&quot;,

                text:
                    &quot;They can smell the exact location of the sea from the nest.&quot;
            },

            {
                image:
                    &quot;assets/flashlight.jpeg&quot;,

                fallback:
                    &quot;assets/ocean.jpeg&quot;,

                text:
                    &quot;They follow the strongest artificial light because it resembles moonlight.&quot;
            },

            {
                image:
                    &quot;assets/plasticbottle.jpeg&quot;,

                text:
                    &quot;They instinctively follow objects that reflect light on the beach.&quot;
            }

        ],

        correct: 0,

        explanation:
            &quot;Correct. Hatchlings use visual orientation cues. The open seaward horizon is normally brighter than the landward side, helping them find the ocean.&quot;

    },


    {

        question:
            &quot;A volunteer finds a hatchling crawling across a beach where a small sand ridge is blocking its path. What is the most appropriate principle to follow?&quot;,

        options: [

            {
                image:
                    &quot;assets/sandheap.jpeg&quot;,

                text:
                    &quot;Remove or reduce the obstacle only if it can be done safely without unnecessarily handling the hatchling.&quot;
            },

            {
                image:
                    &quot;assets/adult.jpeg&quot;,

                text:
                    &quot;Carry the hatchling immediately because every minute on land is dangerous.&quot;
            },

            {
                image:
                    &quot;assets/flashlight.jpeg&quot;,

                fallback:
                    &quot;assets/ocean.jpeg&quot;,

                text:
                    &quot;Shine a light behind it so it moves faster toward the ocean.&quot;
            },

            {
                image:
                    &quot;assets/plasticbottle.jpeg&quot;,

                text:
                    &quot;Leave the obstacle because human intervention is never appropriate.&quot;
            }

        ],

        correct: 0,

        explanation:
            &quot;Correct. The goal is to remove avoidable human-created obstacles while keeping intervention as limited as possible.&quot;

    },


    {

        question:
            &quot;A hatchling reaches the shoreline, but a person suggests holding it for a photograph before releasing it. Which response best reflects responsible conservation practice?&quot;,

        options: [

            {
                image:
                    &quot;assets/adult.jpeg&quot;,

                text:
                    &quot;Do not handle it for a photograph. Allow the hatchling to continue its natural journey unless trained responders have a specific reason to intervene.&quot;
            },

            {
                image:
                    &quot;assets/flashlight.jpeg&quot;,

                fallback:
                    &quot;assets/ocean.jpeg&quot;,

                text:
                    &quot;Hold it briefly because a photograph cannot affect its survival.&quot;
            },

            {
                image:
                    &quot;assets/plasticbottle.jpeg&quot;,

                text:
                    &quot;Move it to a brighter part of the beach so the photograph is clearer.&quot;
            },

            {
                image:
                    &quot;assets/ocean.jpeg&quot;,

                text:
                    &quot;Carry it back to the nest so it can try the journey again.&quot;
            }

        ],

        correct: 0,

        explanation:
            &quot;Correct. Wildlife observation should minimise unnecessary handling and disturbance. The objective is to protect the hatchling&#x27;s natural journey, not turn it into an interaction.&quot;

    }

];


/* =========================================================
   GAME STATE
========================================================= */

let currentQuestion = 0;

let answeredCorrectly = false;


/* =========================================================
   ELEMENTS
========================================================= */

const questionElement =
    document.getElementById(&quot;question&quot;);

const optionsElement =
    document.getElementById(&quot;options&quot;);

const feedbackElement =
    document.getElementById(&quot;feedback&quot;);

const questionCountElement =
    document.getElementById(&quot;questionCount&quot;);

const progressTextElement =
    document.getElementById(&quot;progressText&quot;);

const progressFillElement =
    document.getElementById(&quot;progressFill&quot;);

const nextButton =
    document.getElementById(&quot;nextButton&quot;);

const backButton =
    document.getElementById(&quot;backButton&quot;);

const completeScreen =
    document.getElementById(&quot;complete&quot;);

const completeButton =
    document.getElementById(&quot;completeButton&quot;);


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const q =
        questions[currentQuestion];


    answeredCorrectly =
        false;


    questionElement.textContent =
        q.question;


    questionCountElement.textContent =
        `QUESTION ${currentQuestion + 1} / ${questions.length}`;


    progressTextElement.textContent =
        `HATCHLING WATCH · ${currentQuestion + 1} / ${questions.length}`;


    progressFillElement.style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;


    feedbackElement.textContent =
        &quot;Choose the response that best protects the hatchlings while minimising disturbance.&quot;;


    feedbackElement.style.color =
        &quot;rgba(239,239,232,0.65)&quot;;


    nextButton.classList.remove(
        &quot;ready&quot;
    );


    optionsElement.innerHTML =
        &quot;&quot;;


    q.options.forEach(
        function(optionData, index) {


            const button =
                document.createElement(&quot;button&quot;);


            button.type =
                &quot;button&quot;;


            button.className =
                &quot;option&quot;;


            const image =
                document.createElement(&quot;img&quot;);


            image.className =
                &quot;option-image&quot;;


            image.src =
                optionData.image;


            image.alt =
                &quot;&quot;;


            /*
               Prevent broken image icons.
               If the requested image is missing,
               use the fallback image.
            */

            image.onerror =
                function() {

                    if (
                        optionData.fallback &amp;&amp;
                        image.src.indexOf(
                            optionData.fallback
                        ) === -1
                    ) {

                        image.src =
                            optionData.fallback;

                    }

                };


            const letter =
                document.createElement(&quot;span&quot;);


            letter.className =
                &quot;option-letter&quot;;


            letter.textContent =
                String.fromCharCode(
                    65 + index
                );


            const optionText =
                document.createElement(&quot;span&quot;);


            optionText.className =
                &quot;option-text&quot;;


            optionText.textContent =
                optionData.text;


            button.appendChild(
                letter
            );


            button.appendChild(
                image
            );


            button.appendChild(
                optionText
            );


            button.addEventListener(
                &quot;click&quot;,
                function() {

                    checkAnswer(
                        index,
                        button
                    );

                }
            );


            optionsElement.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    selectedIndex,
    selectedButton
) {

    if (answeredCorrectly) {

        return;

    }


    const q =
        questions[currentQuestion];


    if (
        selectedIndex === q.correct
    ) {

        answeredCorrectly =
            true;


        selectedButton.classList.add(
            &quot;correct&quot;
        );


        feedbackElement.textContent =
            &quot;✓ &quot; + q.explanation;


        feedbackElement.style.color =
            &quot;#73dfe1&quot;;


        document
            .querySelectorAll(&quot;.option&quot;)
            .forEach(
                function(option, index) {

                    option.disabled =
                        true;


                    if (
                        index === q.correct
                    ) {

                        option.classList.add(
                            &quot;correct&quot;
                        );

                    }

                }
            );


        nextButton.classList.add(
            &quot;ready&quot;
        );

    }

    else {

        selectedButton.classList.add(
            &quot;wrong&quot;
        );


        feedbackElement.textContent =
            &quot;✕ Not quite. Think about the principle of protecting the hatchlings while allowing their natural behaviour to continue.&quot;;


        feedbackElement.style.color =
            &quot;#d69a86&quot;;


        selectedButton.disabled =
            true;

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

nextButton.addEventListener(
    &quot;click&quot;,
    function() {


        if (!answeredCorrectly) {

            return;

        }


        currentQuestion++;


        if (
            currentQuestion &lt;
            questions.length
        ) {

            loadQuestion();

        }

        else {

            completeMission();

        }

    }
);


/* =========================================================
   COMPLETE MISSION
========================================================= */

function completeMission() {

    completeScreen.classList.add(
        &quot;show&quot;
    );


    nextButton.classList.remove(
        &quot;ready&quot;
    );

}


/* =========================================================
   MISSION 04
========================================================= */

completeButton.addEventListener(
    &quot;click&quot;,
    function() {

        window.parent.postMessage({ type: &quot;SEA_WHISPER_NAV&quot;, target: &quot;mission4&quot; }, &quot;*&quot;);

    }
);


/* =========================================================
   BACK TO MISSION 02
========================================================= */

backButton.addEventListener(
    &quot;click&quot;,
    function() {

        window.parent.postMessage({ type: &quot;SEA_WHISPER_NAV&quot;, target: &quot;mission2&quot; }, &quot;*&quot;);

    }
);


/* =========================================================
   INFORMATION MODAL
========================================================= */

const infoModal =
    document.getElementById(&quot;infoModal&quot;);

const infoLabel =
    document.getElementById(&quot;infoLabel&quot;);

const infoTitle =
    document.getElementById(&quot;infoTitle&quot;);

const infoText =
    document.getElementById(&quot;infoText&quot;);

const infoClose =
    document.getElementById(&quot;infoClose&quot;);


function openInfo(
    label,
    title,
    text
) {

    infoLabel.textContent =
        label;

    infoTitle.textContent =
        title;

    infoText.textContent =
        text;

    infoModal.classList.add(
        &quot;show&quot;
    );

}


function closeInfo() {

    infoModal.classList.remove(
        &quot;show&quot;
    );

}


infoClose.addEventListener(
    &quot;click&quot;,
    closeInfo
);


infoModal.addEventListener(
    &quot;click&quot;,
    function(event) {

        if (
            event.target === infoModal
        ) {

            closeInfo();

        }

    }
);


/* =========================================================
   FIELD NOTES
========================================================= */

document
    .getElementById(&quot;fieldNotes&quot;)
    .addEventListener(
        &quot;click&quot;,
        function() {

            openInfo(

                &quot;FIELD NOTES&quot;,

                &quot;HATCHLING WATCH&quot;,

                &quot;Hatchlings normally orient toward the open sea using visual cues from the brighter seaward horizon. Artificial coastal lighting can interfere with this orientation. Keep nesting beaches dark, remove avoidable obstacles and minimise unnecessary handling. The safest conservation response is usually to address the human-created disturbance rather than interfere with the animal&#x27;s natural movement.&quot;

            );

        }
    );


/* =========================================================
   TURTLE FACT
========================================================= */

document
    .getElementById(&quot;turtleFact&quot;)
    .addEventListener(
        &quot;click&quot;,
        function() {

            openInfo(

                &quot;TURTLE FACT&quot;,

                &quot;A JOURNEY THAT STARTS IN THE SAND&quot;,

                &quot;Olive Ridley hatchlings emerge after incubation and begin a dangerous journey toward the sea. Odisha&#x27;s coast is one of the world&#x27;s most important Olive Ridley nesting regions, including major sites such as Gahirmatha, Rushikulya and the Devi river mouth. During arribada, very large numbers of females gather to nest. Protecting the darkness and natural conditions of these beaches helps preserve one of Odisha&#x27;s most remarkable natural phenomena.&quot;

            );

        }
    );


/* =========================================================
   ESC CLOSE
========================================================= */

document.addEventListener(
    &quot;keydown&quot;,
    function(event) {

        if (
            event.key === &quot;Escape&quot;
        ) {

            closeInfo();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadQuestion();

&lt;script&gt;

/* =========================================================
   VARIABLES
========================================================= */

let found = 0;

let missionCompleted = false;


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    const shuffled = [...array];

    for (
        let i = shuffled.length - 1;
        i &gt; 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }

    return shuffled;
}


/* =========================================================
   OPTIONS
========================================================= */

const threatOptions = [

    {
        image: &quot;assets/dogsniffing.jpeg&quot;,

        title: &quot;DOG NEAR NEST&quot;,

        correct: true,

        explanation:
            &quot;A dog near a nesting area can disturb a nesting turtle, interfere with natural nesting behaviour, and potentially damage nests or eggs.&quot;
    },


    {
        image: &quot;assets/lamp.jpeg&quot;,

        title: &quot;ARTIFICIAL LIGHT&quot;,

        correct: true,

        explanation:
            &quot;Artificial light can interfere with the natural behaviour of nesting turtles and can also affect hatchlings when they emerge and orient toward the sea.&quot;
    },


    {
        image: &quot;assets/plasticbottle.jpeg&quot;,

        title: &quot;PLASTIC WASTE&quot;,

        correct: true,

        explanation:
            &quot;Plastic waste is a human-made hazard. It can pollute the nesting beach and create risks for turtles and other coastal wildlife.&quot;
    },


    {
        image: &quot;assets/footprints.jpeg&quot;,

        title: &quot;HUMAN FOOTPRINTS&quot;,

        correct: true,

        explanation:
            &quot;Human activity on a nesting beach can disturb turtles and may damage or alter the surface around nests.&quot;
    },


    {
        image: &quot;assets/sandheap.jpeg&quot;,

        title: &quot;NATURAL SAND&quot;,

        correct: false,

        explanation:
            &quot;Natural sand is part of the turtle&#x27;s nesting environment. The presence of sand itself is not a human-made disturbance.&quot;
    },


    {
        image: &quot;assets/adult.jpeg&quot;,

        title: &quot;NESTING TURTLE&quot;,

        correct: false,

        explanation:
            &quot;The nesting turtle belongs on the beach. It is part of the natural ecosystem and is not a human-made threat.&quot;
    }

];


/* =========================================================
   RANDOMIZE OPTIONS
========================================================= */

const shuffledThreats =
    shuffle(threatOptions);


/* =========================================================
   GET GRID
========================================================= */

const threatGrid =
    document.getElementById(
        &quot;threatGrid&quot;
    );


/* =========================================================
   CREATE CARDS
========================================================= */

shuffledThreats.forEach(
    function(threat, index) {

        const card =
            document.createElement(
                &quot;button&quot;
            );

        card.type =
            &quot;button&quot;;

        card.className =
            &quot;threat-card&quot;;

        card.innerHTML = `

            &lt;span class=&quot;threat-number&quot;&gt;
                ${index + 1}
            &lt;/span&gt;

            &lt;img
                src=&quot;${threat.image}&quot;
                alt=&quot;${threat.title}&quot;
            &gt;

            &lt;span class=&quot;threat-title&quot;&gt;
                ${threat.title}
            &lt;/span&gt;

        `;


        /* =================================================
           CARD CLICK
        ================================================= */

        card.addEventListener(
            &quot;click&quot;,
            function() {

                if (
                    card.classList.contains(
                        &quot;correct&quot;
                    )
                ) {
                    return;
                }


                /* =========================================
                   CORRECT
                ========================================= */

                if (threat.correct) {

                    card.classList.add(
                        &quot;correct&quot;
                    );

                    found++;

                    updateProgress();


                    showThreatPopup(
                        true,
                        threat.title,
                        threat.explanation
                    );


                    /* COMPLETE ONLY AFTER 4 CORRECT */

                    if (
                        found === 4 &amp;&amp;
                        !missionCompleted
                    ) {

                        completeMission4();

                    }

                }


                /* =========================================
                   WRONG
                ========================================= */

                else {

                    card.classList.add(
                        &quot;wrong&quot;
                    );


                    showThreatPopup(
                        false,
                        threat.title,
                        threat.explanation
                    );


                    setTimeout(
                        function() {

                            card.classList.remove(
                                &quot;wrong&quot;
                            );

                        },
                        450
                    );

                }

            }
        );


        threatGrid.appendChild(
            card
        );

    }
);


/* =========================================================
   UPDATE PROGRESS
========================================================= */

function updateProgress() {

    const counter =
        document.getElementById(
            &quot;threatCounter&quot;
        );

    const progress =
        document.getElementById(
            &quot;progress&quot;
        );


    counter.textContent =
        &quot;THREATS FOUND · &quot; +
        found +
        &quot; / 4&quot;;


    progress.style.width =
        ((found / 4) * 100) +
        &quot;%&quot;;

}


/* =========================================================
   ANSWER POPUP
========================================================= */

function showThreatPopup(
    correct,
    title,
    explanation
) {

    const oldPopup =
        document.querySelector(
            &quot;.threat-popup&quot;
        );


    if (oldPopup) {
        oldPopup.remove();
    }


    const popup =
        document.createElement(
            &quot;div&quot;
        );


    popup.className =
        &quot;threat-popup&quot;;


    popup.innerHTML = `

        &lt;div class=&quot;popup-box&quot;&gt;

            &lt;div class=&quot;popup-label&quot;&gt;

                ${
                    correct
                    ? &quot;THREAT CONFIRMED&quot;
                    : &quot;NOT A HUMAN-MADE THREAT&quot;
                }

            &lt;/div&gt;


            &lt;h2&gt;
                ${title}
            &lt;/h2&gt;


            &lt;p&gt;
                ${explanation}
            &lt;/p&gt;


            &lt;button
                type=&quot;button&quot;
                id=&quot;closeThreatPopup&quot;
            &gt;

                CLOSE

            &lt;/button&gt;

        &lt;/div&gt;

    `;


    document.body.appendChild(
        popup
    );


    document
        .getElementById(
            &quot;closeThreatPopup&quot;
        )
        .addEventListener(
            &quot;click&quot;,
            function() {

                popup.remove();

            }
        );

}


/* =========================================================
   MISSION 04 COMPLETE
========================================================= */

function completeMission4() {

    /* Must be exactly 4 / 4 */

    if (found !== 4) {
        return;
    }


    if (missionCompleted) {
        return;
    }


    missionCompleted = true;


    /* =====================================================
       COMPLETE PROGRESS BAR
    ===================================================== */

    const progress =
        document.getElementById(
            &quot;progress&quot;
        );


    if (progress) {

        progress.style.width =
            &quot;100%&quot;;

    }


    /* =====================================================
       ENABLE NEXT BUTTON
    ===================================================== */

    const nextButton =
        document.getElementById(
            &quot;nextButton&quot;
        );


    if (nextButton) {

        nextButton.classList.add(
            &quot;ready&quot;
        );

        nextButton.textContent =
            &quot;CONTINUE →&quot;;

    }


    /* =====================================================
       OPEN CONGRATULATIONS BOX
    ===================================================== */

    const completionPopup =
        document.getElementById(
            &quot;completionPopup&quot;
        );


    if (completionPopup) {

        completionPopup.classList.add(
            &quot;show&quot;
        );

    }

}


/* =========================================================
   CLOSE CONGRATULATIONS BOX

        function() {

            const completionPopup =
                document.getElementById(

                );


            if (completionPopup) {

                completionPopup.classList.remove(
                    &quot;show&quot;
                );

            }

        }
    );

}

<script>
(function(){
  const m3 = document.getElementById('mission3Frame');
  const m4 = document.getElementById('mission4Frame');
  function show(target){
    m3.style.display = target === 'mission3' ? 'block' : 'none';
    m4.style.display = target === 'mission4' ? 'block' : 'none';
    window.scrollTo(0,0);
  }
  window.addEventListener('message', function(event){
    if (!event.data || event.data.type !== 'SEA_WHISPER_NAV') return;
    if (event.data.target === 'mission3' || event.data.target === 'mission4') show(event.data.target);
    else if (event.data.target === 'mission2') window.location.href = 'operation_sea_whisper.html';
  });
})();
</script>
