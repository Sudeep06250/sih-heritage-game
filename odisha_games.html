<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#05070f">

<title>Bharat Quest — Konark</title>

<style>

:root {
    --bg-0: #05070f;
    --bg-1: #0a0f1e;

    --neon: #22d3ee;
    --neon-soft: rgba(34,211,238,0.55);

    --text: #e8eefc;
    --muted: #7c88a5;

    --panel: rgba(10,15,30,0.78);
}

/* RESET */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: var(--bg-0);

    color: var(--text);

    font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;
}

/* BACKGROUND */

body {

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(18,55,90,0.55),
            transparent 50%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(34,211,238,0.08),
            transparent 45%
        ),

        linear-gradient(
            180deg,
            #07101f 0%,
            #05070f 100%
        );
}

/* DECORATIVE GLOW */

.glow {

    position: absolute;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    background:
        rgba(34,211,238,0.07);

    filter: blur(80px);

    left: 50%;
    top: 35%;

    transform: translate(-50%,-50%);

    pointer-events: none;
}

/* TOP HUD */

.hud {

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    z-index: 10;

    padding: 20px 18px 40px;

    background:

        linear-gradient(
            180deg,
            rgba(5,7,15,0.95),
            rgba(5,7,15,0)
        );
}

.eyebrow {

    margin: 0 0 6px;

    color: var(--neon);

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 0.32em;

    text-transform: uppercase;
}

h1 {

    margin: 0;

    font-size:
        clamp(28px, 8vw, 46px);

    font-weight: 800;

    letter-spacing: -0.02em;

    text-shadow:
        0 0 18px
        rgba(34,211,238,0.2);
}

.subtitle {

    margin-top: 8px;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.5;

    max-width: 340px;
}

/* TEMPLE */

.temple-scene {

    position: absolute;

    left: 50%;
    top: 47%;

    transform:
        translate(-50%,-50%);

    width:
        min(470px, 92vw);

    height: 300px;

    display: flex;

    justify-content: center;

    align-items: center;
}

/* TEMPLE SILHOUETTE */

.temple {

    position: relative;

    width: 300px;

    height: 220px;

    opacity: 0.92;

    filter:
        drop-shadow(
            0 0 16px
            rgba(34,211,238,0.22)
        );
}

/* MAIN TEMPLE SHAPE */

.temple::before {

    content: "";

    position: absolute;

    bottom: 30px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 230px;

    height: 160px;

    background:

        linear-gradient(
            180deg,
            #273752,
            #101827
        );

    clip-path:

        polygon(
            12% 100%,
            18% 65%,
            26% 72%,
            32% 43%,
            40% 58%,
            48% 25%,
            56% 58%,
            64% 43%,
            72% 72%,
            82% 65%,
            88% 100%
        );
}

/* TEMPLE BASE */

.temple-base {

    position: absolute;

    bottom: 15px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 270px;

    height: 38px;

    border:

        1px solid
        rgba(34,211,238,0.35);

    background:

        linear-gradient(
            180deg,
            #17243a,
            #0b1220
        );

    box-shadow:

        0 0 20px
        rgba(34,211,238,0.15);
}

/* SUN */

.sun {

    position: absolute;

    top: 20px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 50px;
    height: 50px;

    border-radius: 50%;

    border:
        2px solid
        rgba(34,211,238,0.75);

    box-shadow:

        0 0 15px
        rgba(34,211,238,0.5),

        0 0 35px
        rgba(34,211,238,0.18);

    animation:
        pulse 2s ease-in-out infinite;
}

.sun::before,
.sun::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 70px;
    height: 2px;

    background:
        rgba(34,211,238,0.4);

    transform:
        translate(-50%,-50%);
}

.sun::after {

    transform:
        translate(-50%,-50%)
        rotate(90deg);
}

@keyframes pulse {

    0%,100% {
        transform:
            translateX(-50%)
            scale(1);
    }

    50% {
        transform:
            translateX(-50%)
            scale(1.08);
    }
}

/* INFORMATION CARD */

.info-card {

    position: absolute;

    left: 50%;
    bottom: 88px;

    transform:
        translateX(-50%);

    width:
        min(92%, 440px);

    padding: 20px;

    border:

        1px solid
        rgba(34,211,238,0.28);

    border-radius: 22px;

    background:
        var(--panel);

    backdrop-filter:
        blur(14px);

    box-shadow:

        0 18px 55px
        rgba(0,0,0,0.5),

        0 0 25px
        rgba(34,211,238,0.08);
}

.card-tag {

    color: var(--neon);

    font-size: 10px;

    letter-spacing: 0.22em;

    text-transform: uppercase;

    font-weight: 700;
}

.info-card h2 {

    margin:
        6px 0 8px;

    font-size: 21px;
}

.info-card p {

    margin: 0;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.6;
}

/* BUTTON */

.start {

    position: absolute;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    padding:
        13px 26px;

    border-radius:
        999px;

    border:
        1px solid
        var(--neon-soft);

    background:
        rgba(34,211,238,0.1);

    color:
        var(--text);

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 0 22px
        rgba(34,211,238,0.16);

    transition:
        transform 0.2s,
        background 0.2s;
}

.start:hover {

    background:
        rgba(34,211,238,0.22);

    transform:
        translateX(-50%)
        scale(1.04);
}

.start:active {

    transform:
        translateX(-50%)
        scale(0.96);
}

/* FLASH TRANSITION */

.flash {

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle,
            rgba(34,211,238,0.35),
            rgba(5,7,15,0.98)
        );

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.7s ease;
}

.flash.show {

    opacity: 1;
}

</style>
</head>


<body>

<div class="glow"></div>


<!-- TOP -->

<header class="hud">

    <p class="eyebrow">
        Bharat Quest • Odisha
    </p>

    <h1>
        Echoes of Konark
    </h1>

    <p class="subtitle">
        A journey through stone, stories and the legacy of the Sun Temple.
    </p>

</header>


<!-- TEMPLE -->

<section class="temple-scene">

    <div class="temple">

        <div class="sun"></div>

        <div class="temple-base"></div>

    </div>

</section>


<!-- INFORMATION -->

<section class="info-card">

    <div class="card-tag">
        Your journey begins
    </div>

    <h2>
        The Sun Temple awaits.
    </h2>

    <p>
        Step into the world of Konark and uncover the
        stories hidden within its wheels, sculptures and
        architecture.
    </p>

</section>


<!-- BUTTON -->

<button
    class="start"
    onclick="enterKonark()"
>
    Enter Konark →
</button>


<div
    class="flash"
    id="flash"
></div>


<script>

function enterKonark() {

    document
        .getElementById("flash")
        .classList
        .add("show");

    setTimeout(function() {

        window.location.href =
            "konark.html";

    }, 650);

}

</script>

</body>
</html>
